name: Update README

on:
  schedule:
    # Runs every 2 hours (at minute 0)
    - cron: '0 */2 * * *'
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update timestamp in README
        run: |
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          sed -i "/<!-- LAST-UPDATED:START -->/,/<!-- LAST-UPDATED:END -->/c\\<!-- LAST-UPDATED:START -->\\nLast updated: $TIMESTAMP\\n<!-- LAST-UPDATED:END -->" README.md

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: auto-update README timestamp"
          git push
